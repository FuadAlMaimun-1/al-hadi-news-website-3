<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/logo.png">
    <link rel="stylesheet" href="/style.css">
    <title>আল-হাদী | Al-Hadi</title>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-top">
            আজ: <span id="current-date"></span>
        </div>
        <div class="header-main">
    <div class="logo-section">
        <img src="./images/Al hadi Online-01.png" alt="Al-Hadi" class="logo-img">
        <div class="logo-text">
            <h1>al-hadi</h1>
            <p>ন্যায়ের পক্ষে সংগ্রাম</p>
        </div>
        <!-- ৩-লাইনের বাটনটি লোগো সেকশনের ভেতরে বসানো হয়েছে -->
        <button class="nav-toggle" id="nav-toggle">☰</button>
    </div>

    <nav id="nav-menu">
        <a href="#" onclick="loadCategory('all')">সব সংবাদ</a>
        <a href="#" onclick="loadCategory('politics')">রাজনীতি</a>
        <a href="#" onclick="loadCategory('sports')">ক্রীড়া</a>
        <a href="#" onclick="loadCategory('technology')">প্রযুক্তি</a>
        <a href="#" onclick="loadCategory('entertainment')">বিনোদন</a>
        <a href="#" onclick="loadCategory('business')">ব্যবসা</a>
    </nav>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="খোঁজ করুন...">
        <button onclick="searchNews()">খোঁজ</button>
    </div>
</div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="container">
        <!-- FEATURED SECTION -->
        <div class="featured-section" id="featured-section"></div>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-box">
                <h3>🔥 সবচেয়ে বেশি পড়া</h3>
                <div id="trending-list"></div>
            </div>
            <div class="sidebar-box">
                <h3>📌 সর্বশেষ মন্তব্য</h3>
                <div id="comments-list"></div>
            </div>
        </div>

        <!-- NEWS GRID -->
        <div id="news-section"></div>

        <!-- PAGINATION -->
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- MODAL -->
    <div id="newsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img id="modal-img" class="modal-img" alt="">
            <span id="modal-category" class="category"></span>
            <h2 id="modal-title"></h2>
            <p id="modal-date" style="font-size: 12px; color: #999;"></p>
            <p id="modal-description"></p>
            <div style="padding: 20px; background-color: #f5f5f5; border-radius: 4px; margin-top: 20px;">
                <h4 style="margin-bottom: 10px; color: var(--primary-color);">সম্পূর্ণ খবর</h4>
                <p id="modal-full-content" style="line-height: 1.8;"></p>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
